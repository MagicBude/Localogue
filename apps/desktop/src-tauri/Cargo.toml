[package]
name = "localogue-desktop"
version = "0.1.25"
description = "Localogue Desktop Alpha"
authors = ["Localogue Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "localogue_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
walkdir = "2"
